<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#60A5FA" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Sound Waveform Bars with AI Center Node -->
  <rect x="16" y="27" width="3.5" height="10" rx="1.75" fill="#38BDF8" />
  <rect x="23" y="20" width="3.5" height="24" rx="1.75" fill="#60A5FA" />
  <rect x="30" y="14" width="4" height="36" rx="2" fill="#FFFFFF" filter="url(#glow)" />
  <rect x="37.5" y="20" width="3.5" height="24" rx="1.75" fill="#60A5FA" />
  <rect x="44.5" y="27" width="3.5" height="10" rx="1.75" fill="#38BDF8" />
  
  <!-- AI Sparkle / Neural Pulse Dot -->
  <circle cx="32" cy="32" r="4.5" fill="#38BDF8" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
  
  <!-- Futuristic AI Orbitals -->
  <circle cx="48" cy="16" r="2" fill="#F472B6" />
  <circle cx="16" cy="18" r="1.5" fill="#38BDF8" />
</svg>
